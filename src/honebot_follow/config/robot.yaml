# Follower settings for the real robot (4-wheel skid steer). Used by robot_follow.launch.py.
# All of these can be changed live:  ros2 param set /follower brake_decel 5.0
follower:
  ros__parameters:
    target_topic: /target          # from uwb_node (robot frame: x forward, y left)
    cmd_vel_topic: /cmd_vel_raw    # into the safety gate, never straight to the motors
    target_timeout: 0.5

    # Speed-dependent gap: gap(v) = follow_distance + time_headway * v + v^2 / (2 * brake_decel)
    #   4 mph 2.8 m | 8 mph 4.7 m | 12 mph 7.5 m | 15 mph 10.0 m
    # so that if the skater stops dead the robot still stops ~1.5 m short (simulated in test_control.py).
    follow_distance: 1.5           # m, gap when standing still
    time_headway: 0.5              # s
    brake_decel: 4.4               # m/s^2 (0.45 g). The firmware brakes at 0.5 g (fail-safe) to 0.7 g (command):
    #                                keep this at or below what the robot really achieves on the surface.

    max_linear: 3.0                # m/s. START LOW (walking/jogging); raise toward 7.5 as testing allows.
    #                                It must exceed the skater's speed or the robot cannot close the gap.
    kp_angular: 3.0
    max_angular: 3.0               # rad/s
    max_lat_accel: 4.0             # m/s^2: v * omega cap (sideways tip-over is at 1.77 g; tyres slide ~0.8 g)

    # Skid steer scrubs its tyres when it pivots: roll on arcs instead.
    min_turn_radius: 0.4           # m
    arc_speed: 0.6                 # m/s kept while turning toward a target off to the side
    pivot_bearing: 2.0             # rad (115 deg): target further round than this -> pivot in place
    stopped_turn_deadband: 0.6     # rad (34 deg): when stopped next to the skater, do not pivot for less
    #                                than this (the camera pan covers +/-45 deg)
